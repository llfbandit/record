name: record_darwin
description: iOS and macOS implementations for record package called by record_platform_interface.
version: 2.0.0
homepage: https://github.com/llfbandit/record/tree/main/record_darwin

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  record_platform_interface: ^2.1.0

flutter:
  plugin:
    implements: record
    platforms:
      ios:
        pluginClass: RecordDarwinPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: RecordDarwinPlugin
        sharedDarwinSource: true
